<style>
/* Layout : le terrain en pixel art à gauche, l'établi d'outils à droite (empilés sur téléphone). Couleurs : granit et ardoise bretons, volets bleus, lueur des lampadaires. */
:root{
  --bg:#e8ecee; --surface:#f8fafb; --ink:#1e2830; --muted:#5a6872; --line:#cfd6db;
  --accent:#2e6fa8; --accent-soft:#dbe7f2; --glow:#d99a2b;
  --f-display:"Pixelify Sans", "Courier New", monospace;
  --f-body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11171c; --surface:#1a2229; --ink:#e4eaee; --muted:#93a1aa; --line:#2c3842;
  --accent:#7cb0e0; --accent-soft:#22364a; --glow:#f0b850; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11171c; --surface:#1a2229; --ink:#e4eaee; --muted:#93a1aa; --line:#2c3842;
  --accent:#7cb0e0; --accent-soft:#22364a; --glow:#f0b850; color-scheme:dark}
html,body{background:var(--bg);color:var(--ink);overflow-x:hidden;overscroll-behavior:none;max-width:100%}
body{touch-action:pan-y;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.photo-card img{-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto}
body{font-family:var(--f-body);font-size:15px;line-height:1.45;padding-inline:16px;padding-block:20px 32px}
.wrap{max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;flex-direction:column;gap:6px}
.hdr-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.meta{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 16px;color:var(--muted);font-size:14px}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(28px,5vw,40px);margin:0;letter-spacing:.01em;text-wrap:balance}
.sub{color:var(--muted);margin:2px 0 0}
.clock{font-family:var(--f-display);font-size:18px;font-variant-numeric:tabular-nums;color:var(--muted)}
.clock b{color:var(--ink);font-weight:500}
.app{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;align-items:start}
@media (min-width:860px){.app{grid-template-columns:minmax(0,1fr) 320px}}
.stage{display:flex;flex-direction:column;gap:10px;min-width:0}
.board-frame{background:#2b3a44;padding:6px;border-radius:4px;box-shadow:0 2px 0 #1b252c, 0 10px 30px rgba(20,30,40,.18);width:min(100%, max(320px, calc(100svh - 150px)));max-width:100%}
@media (max-width:600px){.board-frame{padding:3px}}
canvas#board{display:block;width:100%;max-width:100%;aspect-ratio:1;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none;cursor:crosshair}
.hand canvas#board{cursor:grab}
.qbtn.sq{min-width:44px;justify-content:center;padding:8px 12px;font-size:18px}
.status{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 14px;color:var(--muted);font-size:14px}
.quick{display:flex;flex-wrap:wrap;gap:8px}
.qbtn{display:flex;align-items:center;gap:6px;font:inherit;font-size:15px;font-weight:700;padding:8px 14px;min-height:44px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.qbtn canvas{width:24px;height:30px;image-rendering:pixelated}
.qbtn:hover{border-color:var(--accent)}
.qbtn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.qbtn:disabled{opacity:.45;cursor:default}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:16px}
.group{display:flex;flex-direction:column;gap:8px}
.label{font-family:var(--f-display);font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:6px}
.tool{display:flex;align-items:center;gap:6px;padding:5px 6px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;font:inherit;font-size:13px;cursor:pointer;text-align:left;min-width:0}
.tool canvas{width:24px;height:30px;image-rendering:pixelated;flex:none}
.tool span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tool:hover{border-color:var(--accent)}
.tool[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button,.btn{font:inherit;font-size:13px;padding:6px 10px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn:hover,.seg button:hover{border-color:var(--accent)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.confirm{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:14px}
.btn.danger{border-color:#b8463b;color:#b8463b}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:6px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:calc(100% - 32px)}
.toast.on{opacity:1}
.hint{font-size:13px;color:var(--muted);margin:0}
[hidden]{display:none!important}
.tabs{gap:4px}
.tabs button{font-family:var(--f-display);font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.hdr-right{display:flex;align-items:center;gap:8px;position:relative;flex:none}
.gear{width:44px;height:44px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:22px;line-height:1;cursor:pointer}
.gear:hover,.gear[aria-expanded="true"]{border-color:var(--accent);color:var(--accent)}
.menu{position:absolute;right:0;top:calc(100% + 6px);z-index:20;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:10px;width:min(290px, calc(100vw - 32px));box-shadow:0 12px 32px rgba(10,20,30,.22)}
.photo{position:fixed;inset:0;z-index:30;background:rgba(10,16,22,.72);display:flex;align-items:center;justify-content:center;padding:16px}
.photo-card{background:var(--surface);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px;align-items:center;max-width:min(560px,100%)}
.photo-card img{width:100%;image-rendering:pixelated;border-radius:4px}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}
</style>

  <div class="app">

</div>
<div class="toast" id="toast" role="status"></div>
<div class="photo" id="photoBox" hidden>
  <div class="photo-card">
    <img id="photoImg" alt="Photo de ton iloe">
    <p class="hint">Appuie longuement sur l'image (ou clic droit) pour l'enregistrer.</p>
    <button class="btn" id="photoClose" type="button">Fermer</button>
  </div>
</div>

<script>
const T = 16, NMAX = 48;
let N = 24, W = N * T;
const board = document.getElementById('board');
const disp = board.getContext('2d');
const world = document.createElement('canvas'); world.width = W; world.height = W;
const ctx = world.getContext('2d');
/* caméra */
let zoom = innerWidth < 700 ? 2 : 1, camX = 0, camY = 0;
const ZMIN = 1, zmax = () => 3 * N / 24;
const vw = () => W / zoom;
function clampCam(){ const v = vw(); camX = Math.max(0, Math.min(W - v, camX)); camY = Math.max(0, Math.min(W - v, camY)); }
function sizeBoard(){ const s = Math.round(vw()); if (board.width !== s){ board.width = s; board.height = s; } }
function setZoom(z, fx = 0.5, fy = 0.5){
  const wx = camX + fx*vw(), wy = camY + fy*vw();
  zoom = Math.max(ZMIN, Math.min(zmax(), z));
  camX = wx - fx*vw(); camY = wy - fy*vw(); clampCam(); sizeBoard();
}
camX = camY = (W - vw())/2; sizeBoard();
const darkCv = document.createElement('canvas'); darkCv.width = W; darkCv.height = W;
const dctx = darkCv.getContext('2d');
let C = ctx;
function R(x, y, w, h, c){ C.fillStyle = c; C.fillRect(x, y, w, h); }
function hs(x, y, k){ let n = (x*374761393 + y*668265263 + k*1442695041) | 0; n = Math.imul(n ^ (n >>> 13), 1274126177); return ((n ^ (n >>> 16)) >>> 0) / 4294967296; }

/* ---------- saisons ---------- */
const SEASONS = {
  printemps:{name:'Printemps', grass:['#86c66a','#72b158','#a1d681'], leaf:['#5ea551','#4a8c42','#f4a9c4'], flowers:['#f6c945','#ef6f8a','#ffffff','#9a7fe0'], sand:'#ead7a2', water:'#4b93c9'},
  ete:{name:'Été', grass:['#7dbd52','#69a742','#96d066'], leaf:['#3f8f3b','#2f7530','#58ad4c'], flowers:['#f6c945','#e45757','#ffffff','#5aa0e8'], sand:'#efd99a', water:'#3f8fd0'},
  automne:{name:'Automne', grass:['#a7b15a','#939c4a','#bcc36e'], leaf:['#e08a30','#c25d29','#f0b44c'], flowers:['#e39b3a','#b4482f','#f2d07a','#8e5aa0'], sand:'#e3cf9a', water:'#4a86b8'},
  hiver:{name:'Hiver', grass:['#eaf1f4','#d3e0e7','#ffffff'], leaf:null, flowers:['#ffffff','#e8f0f4','#ffffff','#cfe0ea'], sand:'#e6e3d8', water:'#a7cfe4'}
};
const SEASON_KEYS = ['printemps','ete','automne','hiver'];
let season = 'automne';
let S = SEASONS[season];

/* ---------- état ---------- */
const SAMPLE_G = [
  "gggggggggssw",
  "gccccccccssw",
  "gcggggggcssw",
  "gcggggggcsww",
  "gcgggpppcsww",
  "gccccpppcsww",
  "ggggcpppgsww",
  "ggggcggggsww",
  "ggggcgggssww",
  "sssscsssswww",
  "wwwwwwwwwwww",
  "wwwwwwwwwwww"];
const SAMPLE_O = [
  "tP..t.Pt.r..",
  "t.........L.",
  "P.h..h.f....",
  "l..ff..f....",
  "t.VV..b..r..",
  ".....l......",
  "hb.l....h..B",
  "t.f.......B.",
  "tPf..h.t....",
  "............",
  "..B.........",
  "......B....."];
let G = [], O = [];
/* agrandit un terrain : l'ancien placé à `off`, les bords prolongés (la mer continue, la lande aussi) */
function expand(g, o, n0, OFF, extras){
  G = []; O = [];
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++){
    const sx = Math.max(0, Math.min(n0-1, x - OFF)), sy = Math.max(0, Math.min(n0-1, y - OFF));
    const inside = x - OFF === sx && y - OFF === sy;
    let gr = g[sy*n0 + sx]; if (!inside && (gr === 'c' || gr === 'p' || gr === 'R')) gr = 'g';
    G.push(gr);
    let ob = inside ? o[sy*n0 + sx] : null;
    if (!inside && extras){
      const r = hs(x, y, 99);
      if (gr === 'g') ob = r < 0.10 ? 't' : r < 0.17 ? 'P' : r < 0.22 ? 'f' : r < 0.24 ? 'r' : null;
      else if (gr === 's') ob = r < 0.05 ? 'r' : null;
      else if (gr === 'w') ob = r < 0.008 ? 'B' : null;
    }
    O.push(ob);
  }
}
function loadSample(){ expand(SAMPLE_G.join(''), SAMPLE_O.join('').split('').map(c => c === '.' ? null : c), 12, Math.round((N - 12)/2) - 1, true); }
function clearAll(){ G = Array(N*N).fill('g'); O = Array(N*N).fill(null); }
const KEY = 'mon-petit-coin-v1';
function save(){ try { localStorage.setItem(KEY, JSON.stringify({n:N, g:G.join(''), o:O.map(c=>c||'.').join(''), season})); } catch(e){} }
function load(){
  try {
    const d = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (d && d.g){
      const o = d.o.split('').map(c => c === '.' ? null : c);
      if (SEASONS[d.season]) season = d.season;
      if (d.g.length === 144){ expand(d.g, o, 12, 5, true); return; }
      const n = Math.round(Math.sqrt(d.g.length));
      if (n*n === d.g.length && n >= 24 && n <= NMAX){ N = n; W = N*T; G = d.g.split(''); O = o; return; }
    }
  } catch(e){}
  loadSample();
}
load(); S = SEASONS[season];
function applySize(){
  world.width = W; world.height = W; darkCv.width = W; darkCv.height = W;
  clampCam(); sizeBoard();
  board.setAttribute('aria-label', `Terrain de ${N} cases sur ${N} à construire`);
}
if (N !== 24){ zoom = (innerWidth < 700 ? 2 : 1) * N / 24; camX = camY = (W - vw())/2; }
applySize();
let saveTimer = null;
function queueSave(){ clearTimeout(saveTimer); saveTimer = setTimeout(save, 300); }

const gAt = (x, y) => (x < 0 || y < 0 || x >= N || y >= N) ? null : G[y*N + x];
const walkable = c => c === 'c' || c === 'p';

/* ---------- dessin du sol ---------- */
function drawGround(t, ox, oy, x, y, nb){
  if (t === 'w'){
    const wc = S.water;
    R(ox, oy, T, T, wc);
    if (season === 'hiver'){
      R(ox + (hs(x,y,1)*10|0)+2, oy + (hs(x,y,2)*10|0)+2, 4, 1, '#d6ecf6');
    } else {
      const ph = now / 1000;
      for (let k = 0; k < 2; k++){
        const wx = ((hs(x,y,k+3)*16 + ph*(3+k)) % 16) | 0;
        const wy = (hs(x,y,k+5)*12 | 0) + 2;
        R(ox + Math.min(wx, 13), oy + wy, 3, 1, 'rgba(255,255,255,.35)');
      }
    }
    const foam = season === 'hiver' ? '#eef7fb' : '#cfe8f4';
    const isW = c => c === null || c === 'w';
    if (!isW(nb(x, y-1))) R(ox, oy, T, 1, foam);
    if (!isW(nb(x, y+1))) R(ox, oy+T-1, T, 1, foam);
    if (!isW(nb(x-1, y))) R(ox, oy, 1, T, foam);
    if (!isW(nb(x+1, y))) R(ox+T-1, oy, 1, T, foam);
    return;
  }
  if (t === 's'){
    R(ox, oy, T, T, S.sand);
    for (let k = 0; k < 4; k++) R(ox + (hs(x,y,k)*15|0), oy + (hs(x,y,k+9)*15|0), 1, 1, 'rgba(120,90,40,.25)');
    return;
  }
  if (t === 'k' || t === 'z'){
    const P = t === 'k' ? {
      printemps:['#93c65c','#7aae48','#a8d872'], ete:['#e6c25a','#cfa43c','#f4d97c'],
      automne:['#c7a76a','#a8864c','#d8bd85'], hiver:['#8a6a4a','#74583c','#eef3f6'] }[season]
      : {
      printemps:['#f2d43a','#7aa848','#fbe470'], ete:['#9fae58','#86964a','#b8c46c'],
      automne:['#7d5a3c','#664730','#93704f'], hiver:['#5c7a4c','#4a663e','#eef3f6'] }[season];
    R(ox, oy, T, T, P[0]);
    for (let r = 0; r < 5; r++) R(ox, oy + 1 + r*3, T, 1, P[1]);
    for (let k = 0; k < 7; k++) R(ox + (hs(x,y,k+200)*16|0), oy + (hs(x,y,k+210)*5|0)*3, 1, 1, P[2]);
    if (season === 'ete' && t === 'k' && !reduce){
      const sw = Math.round(Math.sin(now/700 + x*0.6 + y*0.3));
      for (let r = 0; r < 5; r++) R(ox + ((r*5 + sw + 16) % 16), oy + r*3, 1, 1, '#fff1b8');
    }
    return;
  }
  // herbe sous chemin, route, pavés et herbe
  R(ox, oy, T, T, S.grass[0]);
  for (let k = 0; k < 5; k++){
    const px = hs(x,y,k)*15|0, py = hs(x,y,k+11)*14|0;
    R(ox+px, oy+py, 1, 2, k % 2 ? S.grass[1] : S.grass[2]);
  }
  if (t === 'c'){
    const pc = season === 'hiver' ? '#c9bfae' : '#cdac7c', pd = season === 'hiver' ? '#b3a894' : '#b38f5c';
    const con = c => c === 'c' || c === 'p';
    R(ox+4, oy+4, 8, 8, pc);
    if (con(nb(x, y-1))) R(ox+4, oy, 8, 4, pc);
    if (con(nb(x, y+1))) R(ox+4, oy+12, 8, 4, pc);
    if (con(nb(x-1, y))) R(ox, oy+4, 4, 8, pc);
    if (con(nb(x+1, y))) R(ox+12, oy+4, 4, 8, pc);
    for (let k = 0; k < 3; k++) R(ox+5+(hs(x,y,k+20)*6|0), oy+5+(hs(x,y,k+30)*6|0), 1, 1, pd);
  } else if (t === 'R'){
    const as = season === 'hiver' ? '#6f757c' : '#5b6168', edge = '#4b5157', line = '#f2efe0';
    const isR = c => c === 'R';
    const l = isR(nb(x-1, y)), r = isR(nb(x+1, y)), u = isR(nb(x, y-1)), d = isR(nb(x, y+1));
    R(ox+1, oy+1, 14, 14, as);
    if (l) R(ox, oy+1, 1, 14, as); if (r) R(ox+15, oy+1, 1, 14, as);
    if (u) R(ox+1, oy, 14, 1, as); if (d) R(ox+1, oy+15, 14, 1, as);
    if (!u) R(ox+1, oy+1, 14, 1, edge); if (!d) R(ox+1, oy+14, 14, 1, edge);
    if (!l) R(ox+1, oy+1, 1, 14, edge); if (!r) R(ox+14, oy+1, 1, 14, edge);
    const horiz = l || r, vert = u || d;
    if (horiz && !vert){ R(ox+2, oy+7, 4, 1, line); R(ox+10, oy+7, 4, 1, line); }
    else if (vert && !horiz){ R(ox+7, oy+2, 1, 4, line); R(ox+7, oy+10, 1, 4, line); }
    else if (!horiz && !vert){ R(ox+6, oy+7, 4, 1, line); }
    if (season === 'hiver'){ R(ox+1, oy+1, 2, 1, '#fff'); R(ox+13, oy+14, 2, 1, '#fff'); }
  } else if (t === 'p'){

    tb.onclick = () => { activeGroup = g; document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-pressed', b === tb)); document.querySelectorAll('.tgroup').forEach(w => w.hidden = w.dataset.g !== g); };
    tabs.append(tb);
    const wrap = document.createElement('div'); wrap.className = 'group tgroup'; wrap.dataset.g = g; wrap.hidden = g !== activeGroup;
    const grid = document.createElement('div'); grid.className = 'tools';
    for (const t of TOOLS.filter(t => t.group === g)){
      const b = document.createElement('button'); b.className = 'tool'; b.id = 'tool-' + t.id; b.type = 'button';
      b.setAttribute('aria-pressed', t.id === tool);
      const cv = document.createElement('canvas'); cv.width = 16; cv.height = 20; iconCanvases[t.id] = cv;
      const sp = document.createElement('span'); sp.textContent = t.name;
      b.append(cv, sp);
      b.onclick = () => selectTool(t.id);
      grid.append(b);
    }
    wrap.append(grid); host.append(wrap);
  }
  const ecv = document.createElement('canvas'); ecv.width = 16; ecv.height = 20; iconCanvases.x = ecv;
  document.getElementById('eraseIcon').replaceWith(ecv);
  TOOLS.forEach(drawIcon);
}
let prevTool = 'h';
function selectTool(id){
  if (id !== 'x') prevTool = id;
  tool = id;
  document.querySelectorAll('.tool').forEach(e => e.setAttribute('aria-pressed', e.id === 'tool-' + id));
  document.getElementById('eraseBtn').setAttribute('aria-pressed', id === 'x');
}
document.getElementById('eraseBtn').onclick = () => selectTool(tool === 'x' ? prevTool : 'x');

/* ---------- annuler ---------- */
let history = [];
const undoBtn = document.getElementById('undoBtn');
function snapshot(){ history.push({g:G.join(''), o:O.map(c => c || '.').join('')}); if (history.length > 60) history.shift(); undoBtn.disabled = false; }
undoBtn.onclick = () => {
  const s = history.pop(); if (!s) return;
  G = s.g.split(''); O = s.o.split('').map(c => c === '.' ? null : c);
  undoBtn.disabled = !history.length;
  syncWalkers(); updateStats(); queueSave();
};

/* ---------- pose ---------- */
const toastEl = document.getElementById('toast'); let toastT;
function toast(msg){ toastEl.textContent = msg; toastEl.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => toastEl.classList.remove('on'), 1800); }
function place(x, y, forceErase){
  const i = y*N + x, t = TOOLS.find(t => t.id === (forceErase ? 'x' : tool));
  if (t.kind === 'erase'){ if (O[i]) O[i] = null; else G[i] = 'g'; }
  else if (t.kind === 'ground'){
    G[i] = t.id;
    if (t.id === 'w' && O[i] && O[i] !== 'B') O[i] = null;
    if (t.id !== 'w' && O[i] === 'B') O[i] = null;
    if (t.id === 'c' || t.id === 'R') O[i] = null;
  } else {
    if (t.id === 'B'){ if (G[i] !== 'w'){ toast("La barque se pose sur l'eau"); return; } }
    else if (G[i] === 'w'){ toast('Pose-le sur la terre ferme'); return; }
    else if (G[i] === 'c'){ toast('Les chemins restent libres pour les promeneurs'); return; }
    else if (G[i] === 'R'){ toast('Les routes restent libres pour les voitures'); return; }
    O[i] = t.id;
  }
  syncWalkers(); updateStats(); queueSave();
}
let hover = null, handMode = false;
function cellOf(e){
  const r = board.getBoundingClientRect();
  const wx = camX + (e.clientX - r.left)/r.width*vw(), wy = camY + (e.clientY - r.top)/r.height*vw();
  const x = Math.floor(wx / T), y = Math.floor(wy / T);
  return (x < 0 || y < 0 || x >= N || y >= N) ? null : [x, y];
}
const pts = new Map();
let stroke = null, pendingTouch = null, panDrag = null, gesture = null, lockUntilUp = false;
function startStroke(ev, erase){ const c = cellOf(ev); if (!c) return; snapshot(); stroke = {erase, last:c.join()}; place(c[0], c[1], erase); }
function continueStroke(ev){ const c = cellOf(ev); if (!c) return; const k = c.join(); if (k !== stroke.last){ stroke.last = k; place(c[0], c[1], stroke.erase); } }
function twoPts(){ const [a, b] = [...pts.values()]; return {d: Math.hypot(a.x-b.x, a.y-b.y) || 1, mx:(a.x+b.x)/2, my:(a.y+b.y)/2}; }
board.addEventListener('contextmenu', e => e.preventDefault());
/* la page elle-même ne zoome pas et ne glisse pas : seuls les gestes sur le terrain comptent */
['gesturestart', 'gesturechange', 'gestureend'].forEach(t => document.addEventListener(t, e => e.preventDefault(), {passive:false}));
document.addEventListener('touchmove', e => { if (e.touches.length > 1) e.preventDefault(); }, {passive:false});
let lastTouchEnd = 0;
document.addEventListener('touchend', e => { const t = Date.now(); if (t - lastTouchEnd < 300 && e.target.closest && !e.target.closest('input,textarea')) e.preventDefault(); lastTouchEnd = t; }, {passive:false});
board.addEventListener('pointerdown', e => {
  try { board.setPointerCapture(e.pointerId); } catch(err){}
  pts.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if (pts.size === 2){
    if (pendingTouch){ clearTimeout(pendingTouch.t); pendingTouch = null; }
    stroke = null; panDrag = null; lockUntilUp = true;
    const p = twoPts(); gesture = {...p, z:zoom, cx:camX, cy:camY};
    return;
  }
  if (pts.size > 2 || lockUntilUp) return;
  if (handMode || e.button === 1){ panDrag = {x:e.clientX, y:e.clientY}; board.style.cursor = 'grabbing'; return; }
  const erase = e.button === 2;
  if (e.pointerType === 'touch'){
    const ev = {clientX:e.clientX, clientY:e.clientY};
    pendingTouch = {ev, erase, t:setTimeout(() => { if (pendingTouch){ const p = pendingTouch; pendingTouch = null; startStroke(p.ev, p.erase); } }, 90)};
  } else startStroke(e, erase);
});
board.addEventListener('pointermove', e => {
  hover = e.pointerType === 'mouse' ? cellOf(e) : null;
  if (!pts.has(e.pointerId)) return;
  pts.set(e.pointerId, {x:e.clientX, y:e.clientY});
  const r = board.getBoundingClientRect();
  if (gesture && pts.size >= 2){
    const p = twoPts();
    const wx = gesture.cx + (gesture.mx - r.left)/r.width*(W/gesture.z), wy = gesture.cy + (gesture.my - r.top)/r.height*(W/gesture.z);
    zoom = Math.max(ZMIN, Math.min(zmax(), gesture.z * p.d / gesture.d));
    camX = wx - (p.mx - r.left)/r.width*vw(); camY = wy - (p.my - r.top)/r.height*vw();
    clampCam(); sizeBoard(); return;
  }
  if (panDrag){
    camX -= (e.clientX - panDrag.x) * vw()/r.width; camY -= (e.clientY - panDrag.y) * vw()/r.height;
    panDrag = {x:e.clientX, y:e.clientY}; clampCam(); return;
  }
  if (pendingTouch){ clearTimeout(pendingTouch.t); const p = pendingTouch; pendingTouch = null; startStroke(p.ev, p.erase); }
  if (stroke) continueStroke(e);
});
function endPointer(e){
  pts.delete(e.pointerId);
  if (pendingTouch){ clearTimeout(pendingTouch.t); const p = pendingTouch; pendingTouch = null; startStroke(p.ev, p.erase); }
  if (pts.size < 2) gesture = null;
  if (pts.size === 0){ stroke = null; panDrag = null; lockUntilUp = false; board.style.cursor = ''; }
}
board.addEventListener('pointerup', endPointer); board.addEventListener('pointercancel', endPointer);
board.addEventListener('pointerleave', () => { hover = null; });
board.addEventListener('wheel', e => {
  e.preventDefault();
  const r = board.getBoundingClientRect();
  setZoom(zoom * (e.deltaY < 0 ? 1.15 : 1/1.15), (e.clientX - r.left)/r.width, (e.clientY - r.top)/r.height);
}, {passive:false});
const handBtn = document.getElementById('handBtn');
handBtn.onclick = () => { handMode = !handMode; handBtn.setAttribute('aria-pressed', handMode); document.querySelector('.stage').classList.toggle('hand', handMode); };

/* ---------- saisons, heure, terrain ---------- */
function setSeason(k){
  season = k; S = SEASONS[k];
  document.querySelectorAll('#seasons button').forEach(b => b.setAttribute('aria-pressed', b.dataset.k === k));
  document.getElementById('seasonName').textContent = S.name;
  TOOLS.forEach(drawIcon); resetParticles(); queueSave();
}
const seasonsEl = document.getElementById('seasons');
for (const k of SEASON_KEYS){ const b = document.createElement('button'); b.type = 'button'; b.id = 'season-' + k; b.dataset.k = k; b.textContent = SEASONS[k].name; b.onclick = () => setSeason(k); seasonsEl.append(b); }
const TIMES = [['Matin', 0.30], ['Midi', 0.5], ['Soir', 0.78], ['Nuit', 0.95]];
const timesEl = document.getElementById('times');
for (const [n, v] of TIMES){ const b = document.createElement('button'); b.type = 'button'; b.id = 'time-' + n; b.textContent = n; b.onclick = () => { tday = v; }; timesEl.append(b); }
const autoBtn = document.getElementById('autoTime');
autoBtn.onclick = () => { autoTime = !autoTime; autoBtn.setAttribute('aria-pressed', autoTime); };
if (reduce){ autoTime = false; autoBtn.setAttribute('aria-pressed', 'false'); }
function updateClock(){
  const h = Math.floor(tday*24), m = Math.floor((tday*24 % 1)*4)*15;
  document.getElementById('clock').textContent = `${h} h ${String(m).padStart(2, '0')}`;
}
function updateStats(){
  const hab = residents(), p = walkers.length, v = cars.length;
  const pl = (n, w) => `${n} ${w}${n > 1 ? 's' : ''}`;
  document.getElementById('stats').textContent = `${N}×${N} · ${pl(hab, 'foyer')} · ${pl(p, 'promeneur')} · ${pl(v, 'voiture')}`;
}
let pending = null;
const confirmRow = document.getElementById('confirmRow'), resetRow = document.getElementById('resetRow');
function ask(what, text){ pending = what; document.getElementById('confirmText').textContent = text; confirmRow.hidden = false; resetRow.hidden = true; }
document.getElementById('askClear').onclick = () => ask('clear', 'Effacer tout le terrain ?');
document.getElementById('askSample').onclick = () => ask('sample', 'Remplacer par le village d’exemple ?');
document.getElementById('confirmNo').onclick = () => { confirmRow.hidden = true; resetRow.hidden = false; };

/* ---------- agrandir ---------- */
const growBtn = document.getElementById('growBtn');
function updateGrowBtn(){
  if (N >= NMAX){ growBtn.textContent = `Taille maximale (${N}×${N})`; growBtn.disabled = true; }
  else { growBtn.textContent = `Agrandir : ${N}×${N} → ${N+8}×${N+8}`; growBtn.disabled = false; }
}
growBtn.onclick = () => {
  if (N >= NMAX) return;
  const n0 = N, g = G.join(''), o = [...O], off = 4, sh = off*T;
  N += 8; W = N*T;
  expand(g, o, n0, off, true);
  zoom = zoom * N / n0; camX += sh; camY += sh;
  applySize();
  for (const w of walkers){ w.px += sh; w.py += sh; w.cx += off; w.cy += off; w.tx += off; w.ty += off; if (w.prev){ w.prev[0] += off; w.prev[1] += off; } }
  for (const c of cars){ c.px += sh; c.py += sh; c.cx += off; c.cy += off; c.tx += off; c.ty += off; c.prev = null; }
  history = []; undoBtn.disabled = true;
  resetParticles(); syncWalkers(); updateStats(); updateGrowBtn(); save();
  toast(`Ton terrain fait maintenant ${N}×${N}`);
};
updateGrowBtn();

/* ---------- roue crantée ---------- */
const gearBtn = document.getElementById('gearBtn'), gearMenu = document.getElementById('gearMenu');
function setMenu(open){ gearMenu.hidden = !open; gearBtn.setAttribute('aria-expanded', open); if (!open){ confirmRow.hidden = true; resetRow.hidden = false; } }
gearBtn.onclick = e => { e.stopPropagation(); setMenu(gearMenu.hidden); };
document.addEventListener('pointerdown', e => { if (!gearMenu.hidden && !gearMenu.contains(e.target) && e.target !== gearBtn) setMenu(false); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') setMenu(false); });

/* ---------- photo ---------- */
let downloads = null;
(async () => { try { downloads = await window.claude?.use?.('downloads'); } catch(e){ downloads = null; } })();
const photoBox = document.getElementById('photoBox');
document.getElementById('photoClose').onclick = () => { photoBox.hidden = true; };
photoBox.addEventListener('click', e => { if (e.target === photoBox) photoBox.hidden = true; });
document.getElementById('photoBtn').onclick = async () => {
  const keep = hover; hover = null; render(); hover = keep;
  const k = 4, pad = 8*k, out = document.createElement('canvas');
  out.width = W*k + pad*2; out.height = W*k + pad*2;
  const o = out.getContext('2d'); o.imageSmoothingEnabled = false;
  o.fillStyle = '#2b3a44'; o.fillRect(0, 0, out.width, out.height);
  o.drawImage(world, 0, 0, W, W, pad, pad, W*k, W*k);
  const blob = await new Promise(r => out.toBlob(r, 'image/png'));
  if (!blob){ toast("La photo n'a pas pu être créée"); return; }
  const name = `iloe-${S.name.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '')}.png`;
  if (downloads){
    try { await downloads.save({filename:name, data:blob}); toast('Photo enregistrée'); return; }
    catch(err){ if (err && err.code === 'declined') return; if (err && err.code === 'rate_limited'){ toast('Une demande est déjà ouverte'); return; } }
  }
  try {
    const file = new File([blob], name, {type:'image/png'});
    if (navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:'iloe'}); return; }
  } catch(err){ if (err && err.name === 'AbortError') return; }
  document.getElementById('photoImg').src = URL.createObjectURL(blob);
  photoBox.hidden = false;
};
document.getElementById('confirmYes').onclick = () => {
  snapshot();
  if (pending === 'clear') clearAll(); else loadSample();
  walkers = []; syncWalkers(); updateStats(); save();
  setMenu(false);
};

buildTools(); setSeason(season); syncWalkers(); updateStats();
requestAnimationFrame(frame);
</script>
